name: Freebie Trail API smoke

on:
  workflow_dispatch:
    inputs:
      confirm_one_editorial_request:
        description: Confirm available API credit and authorize one editorial request
        type: boolean
        required: true
        default: false

permissions: {}

concurrency:
  group: freebie-trail-api-smoke
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      inputs.confirm_one_editorial_request == true &&
      vars.FREEBIE_TRAIL_API_SMOKE_ENABLED == 'true'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      approved: ${{ steps.daily.outputs.approved }}
      jst_day: ${{ steps.daily.outputs.jst_day }}
    steps:
      - name: Reject fallback credentials
        shell: bash
        env:
          INHERITED_KEY_PRESENT: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          if [[ "$INHERITED_KEY_PRESENT" != 'false' ]]; then
            echo 'stopped: OPENAI_API_KEY must only be available from the protected environment'
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Reserve the first manual run of the JST day
        id: daily
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          day_start=$(python3 -c 'from datetime import datetime,timezone; from zoneinfo import ZoneInfo; print(datetime.now(ZoneInfo("Asia/Tokyo")).replace(hour=0,minute=0,second=0,microsecond=0).astimezone(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"))')
          gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/freebie-trail-api-smoke.yml/runs" \
            -f branch=main -f event=workflow_dispatch -f "created=>=$day_start" -F per_page=100 \
            | python3 -m radar.api_smoke --daily-slot >> "$GITHUB_OUTPUT"

  editorial-smoke:
    needs: preflight
    if: needs.preflight.outputs.approved == 'true'
    environment: freebie-trail-api
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Send one editorial request
        env:
          FREEBIE_TRAIL_API_SMOKE_ENABLED: ${{ vars.FREEBIE_TRAIL_API_SMOKE_ENABLED }}
          FREEBIE_TRAIL_API_SMOKE_CONFIRMED: ${{ inputs.confirm_one_editorial_request }}
          FREEBIE_TRAIL_API_SMOKE_SLOT: ${{ needs.preflight.outputs.approved }}
          FREEBIE_TRAIL_API_SMOKE_JST_DAY: ${{ needs.preflight.outputs.jst_day }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 -m radar.api_smoke
