name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm exec -- wrangler deploy --dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
      - name: Check mobile and desktop layouts
        run: |
          mkdir -p var
          npm run dev > var/dev.log 2>&1 &
          dev_pid=$!
          trap 'kill "$dev_pid" 2>/dev/null || true' EXIT
          if ! curl --silent --fail --retry 12 --retry-connrefused --retry-delay 1 http://127.0.0.1:8787/en/ -o /dev/null; then
            cat var/dev.log
            exit 1
          fi
          node site/smoke.mjs
          npm run test:browser
        env:
          WRANGLER_SEND_METRICS: 'false'
